<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIR · Due Sguardi V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1422;color:#e9f0fa;font-family:system-ui,Segoe UI,sans-serif}header{padding:18px max(20px,calc((100vw - 1120px)/2));background:#132139;border-bottom:1px solid #33445e;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px;margin:0}h2{font-size:22px}h3{font-size:18px}p{line-height:1.6}.muted{color:#a4b4c8}.wrap{max-width:1120px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{padding:20px;border:1px solid #3e516d;background:#17263e;border-radius:16px;margin:12px 0}button,.button{display:inline-block;border:0;background:#d4ae60;color:#112139;border-radius:9px;padding:12px 17px;cursor:pointer;font-size:15px;font-weight:700;margin:3px}button.alt{background:#304560;color:#f2f7ff}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{display:block;width:100%;background:#0c182a;color:#fff;border:1px solid #63738a;padding:12px;border-radius:8px;margin:8px 0 13px;font:inherit}textarea{min-height:180px;line-height:1.5}label{font-weight:650;font-size:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.tag{display:inline-block;border-radius:30px;padding:5px 11px;background:#31445f;font-size:12px}.good{background:#1b523e}.box{padding:13px;background:#0e1a2d;border-radius:9px;white-space:pre-wrap;line-height:1.55}.face{height:280px;max-width:240px;margin:auto;border-radius:12px;background:#641521 center top/cover no-repeat}.role{text-align:center}.error{color:#ffb9b9}.editor{background:#eaf0f7;color:#132039;min-height:280px;padding:20px;border-radius:10px;line-height:1.6;outline:none}.editor img{max-width:100%;height:auto;border-radius:6px}.list{display:grid;gap:11px}.item{padding:13px;border:1px solid #415371;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#e4c580}hr{border:none;border-top:1px solid #394a61;margin:20px 0}@media(max-width:700px){header{padding:14px}h1{font-size:19px}}@media print{header,button,.no-print{display:none!important}body{background:white;color:black}.card{border:1px solid #aaa;color:black;background:white}.editor{color:black;background:white}}
</style></head><body><header><div><h1>SIR · DUE SGUARDI</h1><div class="muted">High Ball · osservazioni, sintesi e preparazione match</div></div><div id="top"></div></header><main id="app" class="wrap"></main><script>
const endpoint='https://vqrpkkrqynvlzjufiocn.supabase.co/functions/v1/sir-due-sguardi-v2';
let role='',token='',matches=[],match=null,cards=[],card=null,assembled={},timer=null;
const $=s=>document.querySelector(s), safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));
function notice(t,error=false){let e=$('#msg');if(e){e.textContent=t;e.className=error?'error':'muted'}}
function html(t){$('#app').innerHTML=t+'<p id="msg"></p>'}
function btn(t,a,alt=false){return '<button '+(alt?'class="alt" ':'')+'data-action="'+a+'">'+t+'</button>'}
async function api(action,body={}){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...body})});let d=await response.json();if(!response.ok||d.error)throw Error(d.error||'Errore server');return d}
function top(){let labels={staff:'STAFF',loreti:'#10 LORETI',gaggini:'#20 GAGGINI'};$('#top').innerHTML=role?'<div class="row"><strong>'+labels[role]+'</strong>'+btn('Esci','logout',true)+'</div>':''}
function home(){role='';token='';top();html('<h2>Chi lavora oggi?</h2><p class="muted">Tre ambienti separati, ognuno protetto da un PIN di quattro cifre.</p><div class="grid"><div class="card role"><div class="face" style="background-image:url(../due-sguardi/photo-loreti.webp)"></div><h2>#10 · LORETI</h2>'+btn('Entra','login:loreti')+'</div><div class="card role"><div class="face" style="background-image:url(../due-sguardi/photo-gaggini.webp)"></div><h2>#20 · GAGGINI</h2>'+btn('Entra','login:gaggini')+'</div><div class="card role"><h2>STAFF</h2><p class="muted">Preparazione, controllo e pubblicazione</p>'+btn('Entra','login:staff')+'</div></div>')}
function pin(r){role=r;top();html('<div class="card" style="max-width:450px;margin:50px auto"><h2>PIN '+(r==='staff'?'Staff':r.toUpperCase())+'</h2><p class="muted">Quattro cifre, nessuna email.</p><form id="pinform"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required><button type="submit">Apri ambiente</button>'+btn('Indietro','logout',true)+'</form></div>');$('#pinform').onsubmit=async e=>{e.preventDefault();try{notice('Verifica...');const d=await api('login',{role:r,pin:$('#pin').value});token=d.token;await dashboard()}catch(x){notice(x.message,true)}}}
async function dashboard(){top();try{matches=(await api('matches')).data.sort((a,b)=>b.created_at.localeCompare(a.created_at));html('<div class="row spread"><h2>Le partite</h2>'+(role==='staff'?btn('+ Nuova partita','newMatch'):'')+'</div><div class="list">'+matches.map(m=>'<div class="item"><div><strong>'+safe(m.name)+'</strong><div class="muted">High Ball</div></div>'+btn('Apri','match:'+m.id)+'</div>').join('')+'</div>'+(!matches.length?'<div class="card">Non ci sono partite disponibili.</div>':''))}catch(x){html('<div class="card error">'+safe(x.message)+'</div>')}}
function newMatch(){html(btn('← Partite','dashboard',true)+'<div class="card"><h2>Nuova partita</h2><form id="matchform"><label>Nome della partita</label><input id="name" required placeholder="Cuneo - Perugia"><label>Link montaggio generale High Ball</label><input id="video" type="url" required placeholder="https://..."><button type="submit">Crea partita</button></form></div>');$('#matchform').onsubmit=async e=>{e.preventDefault();try{const d=await api('createMatch',{name:$('#name').value,video_url:$('#video').value});await openMatch(d.data[0].id)}catch(x){notice(x.message,true)}}}
async function openMatch(id){try{match=matches.find(x=>x.id===id)||(await api('matches')).data.find(x=>x.id===id);cards=(await api('cards',{match_id:id})).data;html('<div class="row spread">'+btn('← Partite','dashboard',true)+(role==='staff'?btn('+ Aggiungi attaccante','newCard'):'')+'</div><h2>'+safe(match.name)+'</h2><div class="card"><div class="row spread"><strong>Montaggio generale High Ball</strong><a class="button" href="'+safe(match.video_url)+'" target="_blank" rel="noopener noreferrer">Guarda video ↗</a></div></div><h3>Schede degli attaccanti</h3><div class="list">'+cards.map(c=>'<div class="item"><div><strong>'+safe(c.attacker)+'</strong><div class="muted">'+safe(c.ball_type)+'</div></div>'+btn('Apri','card:'+c.id)+'</div>').join('')+'</div>'+(role==='staff'&&cards.length?'<div class="card">'+btn('Crea riepilogo generale','general')+'</div>':'')+(!cards.length?'<p class="muted">Nessuna scheda ancora creata.</p>':''))}catch(x){notice(x.message,true)}}
function newCard(){html(btn('← Partita','backMatch',true)+'<div class="card"><h2>Nuova scheda</h2><form id="cardform"><label>Giocatore avversario</label><input id="attacker" required><label>Tipo di palla alta</label><input id="balltype" required placeholder="HIGH BALL FRONT, BACK, ecc."><button>Crea scheda</button></form></div>');$('#cardform').onsubmit=async e=>{e.preventDefault();try{await api('addCard',{match_id:match.id,attacker:$('#attacker').value,ball_type:$('#balltype').value});await openMatch(match.id)}catch(x){notice(x.message,true)}}}
function note(roleName){return card.notes?.find(n=>n.role===roleName)||{content:'',done:false}}
function section(n,label){const x=note(n);return '<div class="card"><div class="row spread"><h3>'+label+'</h3><span class="tag '+(x.done?'good':'')+'">'+(x.done?'Definitiva':'In lavorazione')+'</span></div><div class="box">'+safe(x.content||'Nessuna analisi inserita.')+'</div>'+(role==='staff'&&x.done?btn('Riapri analisi','reopen:'+n,true):'')+'</div>'}
async function openCard(id){card=cards.find(x=>x.id===id);if(!card)return openMatch(match.id);let content='<div class="row spread">'+btn('← Attaccanti','backMatch',true)+'<span class="tag">'+safe(card.ball_type)+'</span></div><h2>'+safe(card.attacker)+'</h2><div class="card"><a href="'+safe(match.video_url)+'" target="_blank" rel="noopener noreferrer">Apri montaggio High Ball ↗</a></div>';
if(role==='staff'){content+='<div class="cols">'+section('loreti','#10 Loreti')+section('gaggini','#20 Gaggini')+'</div><div class="card"><h3>Sintesi Staff</h3><p class="muted">La sintesi AI non sostituisce le osservazioni originali. Puoi modificarla e salvarla.</p><textarea id="summary">'+safe(card.summary||'')+'</textarea><div class="row">'+btn('GENERA SINTESI','generate')+btn('Salva sintesi','saveSummary',true)+'</div></div>'}
else{const x=note(role);content+='<div class="card"><div class="row spread"><h3>La mia analisi libera</h3><span class="tag '+(x.done?'good':'')+'">'+(x.done?'Definitiva':'Bozza')+'</span></div>'+(x.done?'<div class="box">'+safe(x.content)+'</div><p class="muted">Per correggere una scheda definitiva chiedi allo Staff di riaprirla.</p>':'<textarea id="note" placeholder="Le mie osservazioni...">'+safe(x.content)+'</textarea><div class="row">'+btn('Salva bozza','saveNote',true)+btn('Analisi definitiva ✓','finishNote')+'</div>')+'</div>'}
html(content)}
async function saveNote(done){try{let content=$('#note')?.value||'';if(done&&!content.trim())return notice('Scrivi prima la tua analisi.',true);await api('saveNote',{card_id:card.id,content,done});await openMatch(match.id);await openCard(card.id);notice(done?'Analisi definitiva salvata.':'Bozza salvata.')}catch(x){notice(x.message,true)}}
async function saveSummary(){try{await api('saveSummary',{card_id:card.id,summary:$('#summary').value});const id=card.id;await openMatch(match.id);await openCard(id);notice('Sintesi salvata.')}catch(x){notice(x.message,true)}}
async function generate(){try{notice('Sto confrontando le due analisi...');const d=await api('generate',{card_id:card.id});$('#summary').value=d.summary;notice('Sintesi generata. Controllala e premi Salva sintesi.')}catch(x){notice(x.message,true)}}
async function general(){cards=(await api('cards',{match_id:match.id})).data;assembled={};const body=cards.map(c=>{assembled[c.id]=c.summary||'';return '<div class="card"><h3>'+safe(c.attacker)+' · '+safe(c.ball_type)+'</h3><div class="row no-print"><button data-action="bold:'+c.id+'" class="alt">Grassetto</button><button data-action="image:'+c.id+'" class="alt">Aggiungi immagine</button></div><div id="ed-'+c.id+'" class="editor" contenteditable="true">'+safe(c.summary||'').replace(/\n/g,'<br>')+'</div></div>'}).join('');html(btn('← Partita','backMatch',true)+'<h2>Riepilogo generale · '+safe(match.name)+'</h2><p class="muted">Modifica le sottoschede, incolla testi e immagini, poi esporta il capitolo per PREPARA MATCH.</p>'+body+'<div class="card no-print">'+btn('Scarica capitolo JSON','export')+btn('Stampa / PDF','print',true)+'</div><input type="file" id="picture" accept="image/*" hidden>')}
function exportChapter(){const payload={format:'sir-match-chapter',version:1,chapterType:'HIGH_BALL',match:{id:match.id,name:match.name,videoUrl:match.video_url},title:'HIGH BALL AVVERSARI',createdAt:new Date().toISOString(),sections:cards.map(c=>({attacker:c.attacker,ballType:c.ball_type,contentHtml:$('#ed-'+c.id).innerHTML,notes:{loreti:c.notes?.find(x=>x.role==='loreti')?.content||'',gaggini:c.notes?.find(x=>x.role==='gaggini')?.content||''}}))};const a=document.createElement('a'),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='SIR_HIGH_BALL_'+match.name.replace(/[^a-z0-9]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notice('Capitolo scaricato. Il modulo di importazione in PREPARA MATCH va ancora realizzato.')}
document.body.addEventListener('click',async e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;try{if(a==='logout')return home();if(a.startsWith('login:'))return pin(a.split(':')[1]);if(a==='dashboard')return dashboard();if(a==='newMatch')return newMatch();if(a.startsWith('match:'))return openMatch(a.slice(6));if(a==='backMatch')return openMatch(match.id);if(a==='newCard')return newCard();if(a.startsWith('card:'))return openCard(a.slice(5));if(a==='saveNote')return saveNote(false);if(a==='finishNote')return confirm('Rendere definitiva questa analisi?')&&saveNote(true);if(a==='saveSummary')return saveSummary();if(a==='generate')return generate();if(a.startsWith('reopen:')){await api('reopenNote',{card_id:card.id,note_role:a.split(':')[1]});await openMatch(match.id);return openCard(card.id)}if(a==='general')return general();if(a==='export')return exportChapter();if(a==='print')return print();if(a.startsWith('bold:')){const ed=$('#ed-'+a.split(':')[1]);ed.focus();document.execCommand('bold')}if(a.startsWith('image:')){let input=$('#picture');input.onchange=()=>{const f=input.files[0];if(!f)return;if(f.size>1500000)return notice('Immagine troppo grande: massimo 1,5 MB.',true);const rd=new FileReader();rd.onload=()=>{const img=document.createElement('img');img.src=rd.result;$('#ed-'+a.split(':')[1]).append(img)};rd.readAsDataURL(f)};input.click()}}catch(x){notice(x.message,true)}});
home();</script></body></html>
