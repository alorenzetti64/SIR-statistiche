</aside>
<main><header class="top"><div><div class="kicker" id="date-heading"></div><h1 id="heading">La tua settimana</h1></div><button class="btn" id="open-add">＋ Nuovo evento</button></header><div id="screen"></div></main>
</div>
<nav class="bottomnav"><button data-nav="home" class="active"><b>⌂</b>Inizio</button><button data-nav="games"><b>◈</b>Partite</button><button data-nav="calendar"><b>▦</b>Agenda</button><button data-nav="events"><b>✎</b>Eventi</button></nav>

<div class="modalhead"><h2 id="dialog-title">Nuovo evento</h2><button class="close" id="x-close" aria-label="Chiudi">×</button></div>
<form id="event-form"><input type="hidden" id="f-id"><div class="formgrid">
<div class="fieldgroup wide"><label for="f-title">Nome dell'evento *</label><input id="f-title" class="field" maxlength="160" placeholder="Es. Riunione, appuntamento, manutenzione…" required></div>
<div class="fieldgroup"><label for="f-category">Categoria</label><select id="f-category" class="field"><option value="lavoro">Lavoro</option><option value="personali">Personali</option><option value="casa">Casa</option><option value="varie">Varie</option></select></div>
<div class="fieldgroup"><label for="f-date">Data *</label><input type="date" id="f-date" class="field" required></div>
<div class="fieldgroup"><label for="f-start">Ora di inizio (facoltativa)</label><input type="time" id="f-start" class="field"></div>
<div class="fieldgroup"><label for="f-end">Ora di fine (facoltativa)</label><input type="time" id="f-end" class="field"></div>
<div class="fieldgroup wide"><label for="f-location">Luogo</label><input id="f-location" class="field" maxlength="220" placeholder="Indirizzo o città"></div>
<div class="fieldgroup wide"><label for="f-notes">Note</label><textarea id="f-notes" class="field" rows="3" maxlength="2500" placeholder="Dettagli utili…"></textarea></div>
</div><div class="formactions"><button type="button" class="btn ghost" id="cancel">Annulla</button><button class="btn" type="submit">Salva evento</button></div></form></div></div>

function eventsView(){const filtered=events.filter(e=>(categoryFilter==='all'||e.category===categoryFilter)&&(e.title+' '+(e.notes||'')+' '+(e.location||'')).toLowerCase().includes(textFilter.toLowerCase())).sort(compareEvents);return '<p class="lead">Crea impegni personali, di lavoro, di casa o di altro tipo. Puoi modificarli quando vuoi.</p><div class="filters">'+[['all','Tutti'],...Object.entries(CATEGORIES)].map(o=>'<button data-category="'+o[0]+'" class="chip '+(o[0]===categoryFilter?'active':'')+'">'+o[1]+'</button>').join('')+'</div><div class="controls"><input id="event-search" class="search" aria-label="Cerca eventi" placeholder="Cerca un evento..." value="'+safe(textFilter)+'"><div class="actions"><button id="export" class="btn small ghost">Esporta backup</button><button id="import" class="btn small ghost">Importa backup</button></div></div><div class="panel padded">'+(filtered.length?filtered.map(displayEvent).join(''):'<div class="empty">Nessun evento trovato. Clicca “Nuovo evento” per aggiungerne uno.</div>')+'</div><div class="backup"><b>Come vengono salvati i dati:</b> gli appuntamenti restano soltanto in questo browser, su questo dispositivo. Non c’è un account e non sono caricati su un server. Usa il backup per spostarli su un altro telefono o per conservarne una copia.</div>'}

rtita')+'</div></div></div>').join(''):'<div class="empty">Nessun impegno in questa giornata.</div>')+'</div>'+sourceNote()}

async function frAuthRequest(path,payload){const r=await fetch(FR_SB+"/auth/v1/"+path,{method:"POST",headers:{"apikey":FR_KEY,"content-type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.error_description||d.message||d.error||"Impossibile accedere");return d}
async function frRefresh(){if(!frSession?.refresh_token)throw Error("Sessione scaduta");const d=await frAuthRequest("token?grant_type=refresh_token",{refresh_token:frSession.refresh_token});frSaveSession(d);return d}
async function frDb(path,method="GET",data=null,extraHeaders={}){if(!frSession)throw Error("Accesso richiesto");if(frSession.expires_at&&Date.now()/1000>frSession.expires_at-90)await frRefresh();const invoke=()=>fetch(FR_SB+"/rest/v1/"+path,{method,headers:{"apikey":FR_KEY,"authorization":"Bearer "+frSession.access_token,"content-type":"application/json",...extraHeaders},body:data===null?undefined:JSON.stringify(data)});let res=await invoke();if(res.status===401){await frRefresh();res=await invoke()}if(!res.ok){let d=await res.json().catch(()=>({}));throw Error(d.message||d.error||("Server "+res.status))}if(res.status===204||method==="DELETE")return null;let s=await res.text();return s?JSON.parse(s):null}
async function frLoad(){if(!frSession)return;cloudBusy=true;frStatus("Caricamento eventi privati…",true);try{let items=await frDb("francesca_agenda_events?select=id,data&owner_id=eq."+encodeURIComponent(frSession.user.id));remoteIds=new Set(items.filter(x=>x.id!=="__superlega_ical").map(x=>x.id));let remote=items.map(x=>x.data).filter(x=>x&&typeof x.title==="string");let extras=priorLocal.filter(x=>x&&typeof x.title==="string"&&!remoteIds.has(x.id));
if(extras.length&&confirm("Sono presenti "+extras.length+" eventi salvati nella vecchia versione su questo dispositivo. Vuoi importarli anche online?")){remote.push(...extras)}
events=remote;localStorage.setItem(KEY,JSON.stringify(events));render();if(extras.length&&remote.length>items.length)await frSyncNow();frStatus("Eventi privati sincronizzati · "+(frSession.user.email||""),false)}
catch(err){frStatus("Errore sincronizzazione · "+err.message,true)}
finally{cloudBusy=false}}
async function frSyncNow(){if(!frSession)return;const wanted=events.map(x=>({owner_id:frSession.user.id,id:x.id,data:x})),nextIds=new Set(events.map(x=>x.id));if(wanted.length)await frDb("francesca_agenda_events?on_conflict=owner_id,id","POST",wanted,{"prefer":"resolution=merge-duplicates,return=minimal"});for(const id of remoteIds){if(!nextIds.has(id))await frDb("francesca_agenda_events?owner_id=eq."+encodeURIComponent(frSession.user.id)+"&id=eq."+encodeURIComponent(id),"DELETE")}remoteIds=nextIds;frStatus("Eventi privati sincronizzati · "+(frSession.user.email||""),false)}
const originalStore=store;
store=function(){originalStore();if(frSession){frStatus("Salvataggio online…",true);pendingSync=pendingSync.then(()=>frSyncNow()).catch(e=>{frStatus("Eventi salvati sul dispositivo · Sincronizzazione non riuscita",true);console.error("Sync:",e.message)})}};
const originalOpen=openModal;
openModal=function(e,date){if(!frSession){frOpenAuth();return}originalOpen(e,date)};
const originalEventsView=eventsView;
eventsView=function(){if(!frSession)return '<div class="panel private-prompt"><h2>Gli appuntamenti di Francesca</h2><p>Questa parte dell’agenda è privata. Accedi oppure crea un account con la tua email per sincronizzare gli eventi fra telefono e computer.</p><button type="button" id="privateLogin" onclick="frOpenAuth()">Accedi / Registrati</button></div>';return originalEventsView().replace("gli appuntamenti restano soltanto in questo browser, su questo dispositivo. Non c’è un account e non sono caricati su un server.","gli appuntamenti sono sincronizzati nell’account personale tramite un database protetto. È consigliabile conservare anche un backup.")};
const originalSourceNote=sourceNote;
sourceNote=function(){return originalSourceNote()};
async function frLogout(){try{if(frSession?.access_token)await fetch(FR_SB+"/auth/v1/logout",{method:"POST",headers:{apikey:FR_KEY,authorization:"Bearer "+frSession.access_token}})}catch{}frSession=null;remoteIds.clear();localStorage.removeItem(FR_SESSION_KEY);localStorage.removeItem(KEY);events=[];frAccount();render()}
document.getElementById("frForm").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("frError"),btn=document.getElementById("frSubmit");msg.textContent="";btn.disabled=true;const email=document.getElementById("frEmail").value.trim(),password=document.getElementById("frPassword").value;try{
if(authMode==="signup"){const d=await frAuthRequest("signup",{email,password});if(!d.access_token){msg.style.color="#32774b";msg.textContent="Registrazione richiesta. Apri l’email di conferma, poi torna qui e premi «Accedi».";return}frSaveSession(d)}
else{const d=await frAuthRequest("token?grant_type=password",{email,password});frSaveSession(d)}
frCloseAuth();await frLoad();
}catch(err){msg.style.color="#a04839";msg.textContent=({invalid_credentials:"Email o password non valide.",email_not_confirmed:"Conferma prima l’indirizzo email."})[err.message]||err.message}finally{btn.disabled=false}};
async function frMatches(){ /* Collegamento dinamico in sync-superlega.js */ }
async function frBoot(){if(!frSession){events=[];render();frAccount()}else{frAccount();try{if(frSession.expires_at&&Date.now()/1000>frSession.expires_at-90)await frRefresh();await frLoad()}catch(e){frStatus("Ricollega l’account per sincronizzare",true)}}frMatches()}
frBoot();
window.addEventListener("online",()=>{if(frSession){pendingSync=pendingSync.then(()=>frSyncNow()).catch(()=>{});setTimeout(frLoad,3000)}frMatches()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&frSession&&!cloudBusy){pendingSync.then(frLoad).catch(()=>{})}});

</script>
