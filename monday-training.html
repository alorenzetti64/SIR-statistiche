<!doctype html>
<html lang="it" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e41f2b">
<title>SIR Perugia — Allenamento di lunedì</title>
<style>
:root{
  --sir:#e31d2b;
  --sir-dark:#b90e19;
  --ink:#111317;
  --muted:#656a73;
  --paper:#f5f6f8;
  --white:#ffffff;
  --line:#e6e8ec;
  --soft-red:#fff1f2;
  --shadow:0 10px 30px rgba(17,19,23,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 100% 10%,rgba(227,29,43,.10),transparent 18rem),
    linear-gradient(180deg,#fff 0,#f6f7f9 44%,#f2f3f5 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}
.page{width:min(720px,100%);margin:0 auto;padding:0 14px 44px}

.hero{
  position:relative;
  margin:0 -14px;
  padding:18px 18px 28px;
  min-height:310px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.10),transparent 28%),
    linear-gradient(135deg,var(--sir) 0%,#d51220 56%,#b80e18 100%);
  overflow:hidden;
  color:#fff;
  border-radius:0 0 34px 34px;
  box-shadow:0 18px 45px rgba(227,29,43,.25);
}
.hero:before{
  content:"";
  position:absolute;
  width:290px;height:290px;
  right:-160px;top:-105px;
  border:38px solid rgba(255,255,255,.10);
  border-radius:50%;
}
.hero:after{
  content:"";
  position:absolute;
  left:-70px;bottom:-82px;
  width:220px;height:220px;
  background:rgba(0,0,0,.08);
  transform:rotate(18deg);
  border-radius:36px;
}
.hero-top{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo-shell{
  display:flex;align-items:center;gap:10px;
  min-width:0;
}
.logo{
  width:64px;height:64px;
  background:#fff;
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
  flex:0 0 auto;
}
.logo img{width:56px;height:56px;object-fit:contain}
.logo-fallback{display:none;color:#101010;font-weight:950;font-size:13px;line-height:1;text-align:center}
.club{
  font-size:11px;
  letter-spacing:.12em;
  line-height:1.25;
  font-weight:900;
  opacity:.92;
  text-transform:uppercase;
}
.hero-date{
  flex:0 0 auto;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(6px);
  padding:8px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:850;
}
.hero-copy{position:relative;z-index:2;margin-top:32px}
.kicker{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-weight:900;
  margin-bottom:8px;
  opacity:.84;
}
.hero-day{
  display:block;
  margin:0;
  font-size:clamp(56px,17vw,96px);
  line-height:.86;
  letter-spacing:-.065em;
  font-weight:1000;
  text-transform:uppercase;
}
.hero-title{
  display:block;
  margin-top:10px;
  font-size:clamp(22px,7vw,34px);
  line-height:1.02;
  letter-spacing:-.025em;
  font-weight:950;
  max-width:560px;
}
.hero-intro{
  margin:14px 0 0;
  max-width:560px;
  font-size:15px;
  line-height:1.45;
  color:rgba(255,255,255,.91);
  font-weight:560;
}

.lang-wrap{
  position:sticky;top:0;z-index:20;
  margin:14px 0 18px;
  padding:8px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(229,231,235,.9);
  border-radius:18px;
  backdrop-filter:blur(14px);
  box-shadow:0 10px 28px rgba(17,19,23,.08);
}
.langs{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
}
.lang{
  appearance:none;border:0;
  min-height:42px;
  padding:8px 6px;
  border-radius:12px;
  background:transparent;
  color:#555b64;
  font-size:11px;
  font-weight:950;
  letter-spacing:.04em;
  cursor:pointer;
}
.lang[aria-pressed="true"]{
  background:var(--ink);
  color:#fff;
  box-shadow:0 7px 18px rgba(17,19,23,.16);
}

.section-label{
  margin:8px 4px 10px;
  font-size:12px;
  font-weight:950;
  letter-spacing:.14em;
  color:#7a7f87;
  text-transform:uppercase;
}

.timeline{display:grid;gap:13px}
.block{
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.block:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:5px;
  background:var(--sir);
}
.block-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.time{
  font-size:31px;
  line-height:1;
  letter-spacing:-.055em;
  font-weight:1000;
  color:var(--ink);
}
.time-note{
  color:var(--sir);
  font-size:11px;
  font-weight:950;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.cluster{display:grid;gap:9px}
.item{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:11px;
  align-items:start;
  padding:11px 12px;
  border-radius:17px;
  background:#f8f9fb;
  border:1px solid #eef0f3;
}
.icon{
  width:42px;height:42px;
  border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:var(--soft-red);
  color:var(--sir);
  font-weight:1000;
  font-size:14px;
}
.item-title{
  margin:1px 0 2px;
  font-size:15px;
  line-height:1.2;
  font-weight:950;
}
.item-text{
  margin:0;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.43;
}
.names{color:var(--ink);font-weight:900}
.single .item{background:#fff;border:0;padding:0;grid-template-columns:52px 1fr}
.single .icon{width:52px;height:52px;border-radius:16px}
.single .item-title{font-size:17px}
.single .item-text{font-size:14px}

.speech{
  background:
    radial-gradient(circle at 85% 18%,rgba(255,255,255,.20),transparent 8rem),
    linear-gradient(135deg,var(--sir) 0%,#ca1220 100%);
  border:0;
  color:#fff;
  box-shadow:0 16px 36px rgba(227,29,43,.23);
}
.speech:before{background:#fff}
.speech .time{color:#fff}
.speech .time-note{color:#fff;opacity:.78}
.speech .item{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.speech .icon{background:#fff;color:var(--sir)}
.speech .item-title{color:#fff}
.speech .item-text{color:rgba(255,255,255,.92)}
.speech .names{color:#fff}

.closing{
  margin-top:18px;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px 18px 20px;
  box-shadow:var(--shadow);
}
.closing-text{
  font-size:16px;
  line-height:1.5;
  color:#3b3f45;
}
.signature{
  margin-top:10px;
  color:var(--sir);
  font-size:22px;
  font-weight:1000;
}
.micro{
  margin-top:18px;
  text-align:center;
  font-size:10px;
  letter-spacing:.16em;
  font-weight:900;
  color:#9a9ea5;
}

[dir="rtl"] .block:before{left:auto;right:0}
[dir="rtl"] .item{text-align:right}
[dir="rtl"] .hero-copy{text-align:right}
[dir="rtl"] .club{text-align:right}

@media(max-width:420px){
  .page{padding:0 10px 32px}
  .hero{margin:0 -10px;padding:14px 14px 25px;border-radius:0 0 28px 28px;min-height:294px}
  .logo{width:58px;height:58px;border-radius:16px}.logo img{width:51px;height:51px}
  .club{font-size:10px}
  .hero-date{font-size:10px;padding:7px 9px}
  .hero-copy{margin-top:29px}
  .hero-intro{font-size:14px}
  .lang-wrap{margin-top:12px;border-radius:16px;padding:6px}
  .langs{gap:4px}
  .lang{font-size:10px;min-height:40px;padding:7px 3px}
  .block{border-radius:21px;padding:15px}
  .time{font-size:29px}
  .item{grid-template-columns:39px 1fr;padding:10px}
  .icon{width:39px;height:39px}
}

.program-app{
  margin-top:16px;
  padding:18px 14px 16px;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
}
.program-app-note{
  max-width:520px;
  margin:0 auto 12px;
  color:#555b64;
  font-size:13.5px;
  line-height:1.45;
  font-weight:650;
}
.program-app-link{
  display:inline-block;
  max-width:100%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(17,19,23,.12);
  transition:transform .16s ease, box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.program-app-link:active{transform:scale(.985)}
.program-app-link img{
  display:block;
  width:min(285px,100%);
  height:auto;
}

</style>
</head>

</main>

function render(lang){
  const d=T[lang]||T.it;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="fa"?"rtl":"ltr";

  document.getElementById("kicker").textContent=d.kicker;
  document.getElementById("day").textContent=d.day;
  document.getElementById("heading").textContent=d.heading;
  document.getElementById("intro").textContent=d.intro;
  document.getElementById("date").textContent=d.date;
  document.getElementById("sectionLabel").textContent=d.sectionLabel;
  document.getElementById("closing").innerHTML=d.closing;
  document.getElementById("appNote").textContent=APP_NOTE[lang]||APP_NOTE.it;

  document.getElementById("timeline").innerHTML=d.groups.map(g=>{
    const klass="block"+(g.speech?" speech":"")+(g.items.length===1?" single":"");
    return `
      <article class="${klass}">
        <div class="block-head">
          <div class="time">${g.time}</div>
          <div class="time-note">${g.note}</div>
        </div>
        <div class="cluster">
          ${g.items.map(it=>`
            <div class="item">
              <div class="icon">${it.icon}</div>
              <div>
                <h2 class="item-title">${it.title}</h2>
                <p class="item-text">${it.text}</p>
              </div>
            </div>
          `).join("")}
        </div>
      </article>
    `;
  }).join("");

  document.querySelectorAll(".lang").forEach(b=>{
    b.setAttribute("aria-pressed",String(b.dataset.lang===lang));
  });
  try{localStorage.setItem("sir-lang",lang)}catch(e){}
}

document.querySelectorAll(".lang").forEach(b=>{
  b.addEventListener("click",()=>render(b.dataset.lang));
});

let initial="it";
try{initial=localStorage.getItem("sir-lang")||"it"}catch(e){}
render(T[initial]?initial:"it");
</script>
</body>
</html>
