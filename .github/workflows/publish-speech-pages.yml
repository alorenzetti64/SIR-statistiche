name: Request GitHub Pages update for Match Story

on:
  push:
    branches: [SIR-Match-Story]
    paths:
      - "match-story/**"
      - "assets/**"
      - ".github/workflows/publish-speech-pages.yml"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  request-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/publish-speech-pages.yml/dispatches" \
            --method POST \
            -f ref=main
