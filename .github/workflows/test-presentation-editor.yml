name: Test Match Story manual presentation editor
on:
  push:
    branches: [SIR-Match-Story]
    paths:
      - ".github/workflows/test-presentation-editor.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.58.1
      - name: Browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1450,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          const report={id:'match-test-edit',title:'Perugia vs Test',competition:'SuperLega',match_date:'2026-10-13',report_category:'SuperLega',venue:'Casa'};
          let saved=null,saves=0;
          await page.route('**/functions/v1/match-story-api**',async route=>{
            const request=route.request(),url=new URL(request.url()),action=url.searchParams.get('action');
            let res={ok:true};
            if(action==='list'||action==='public-archive')res={reports:[report]};
            if(action==='status')res={configured:true};
            if(action==='draft')res={report:{draft:{}}};
            if(action==='sections')res={sections:[{owner:'Angelo',section_id:'test-id',title:'Capitolo Test',content:'<p>Introduzione alla gara</p><section class="editor-content-card"><h3>Card originale</h3><p>Contenuto della card</p></section>',position:0}]};
            if(action==='presentation')res={pages:saved};
            if(action==='presentation-save'){saved=JSON.parse(request.postData()).pages;saves++;res={ok:true,pages:saved.length}};
            if(action==='presentation-reset'){saved=null;res={ok:true}};
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(res)});
          });
          try{
            await page.goto('http://127.0.0.1:8765/match-story/index.html',{waitUntil:'domcontentloaded'});
            await page.locator('[data-edit-presentation="match-test-edit"]').click({timeout:20000});
            const editor=page.locator('.sir-editor-toolbar');await editor.waitFor({timeout:20000});
            const slide=page.locator('.sir-presentation-slide:not([hidden])');
            assert.ok(await slide.count(),'Must display a slide');
            const intro=slide.locator('.sir-presentation-block').first();
            await intro.click();
            await editor.locator('[data-ed="text"]').click();
            await intro.fill('Testo presentazione personalizzato');
            await editor.locator('[data-ed="save"]').click();
            await page.getByText(/Presentazione salvata online/).waitFor({timeout:12000});
            assert.equal(saves,1);
            assert.equal(saved.length,2,'Introduction and card on separate 16:9 pages');
            assert.ok(JSON.stringify(saved).includes('Testo presentazione personalizzato'));
            await page.locator('[data-presentation-close]').click();
            await page.locator('[data-present-report="match-test-edit"]').click();
            await page.locator('.sir-presentation-slide:not([hidden])').getByText('Testo presentazione personalizzato').waitFor({timeout:16000});
            await page.locator('[data-presentation-close]').click();
            await page.locator('[data-edit-presentation="match-test-edit"]').click();
            await editor.waitFor();
            await editor.locator('[data-ed="add"]').click();
            await editor.locator('[data-ed="make-text"]').click();
            await editor.locator('[data-ed="save"]').click();
            await page.getByText(/Presentazione salvata online/).waitFor({timeout:12000});
            assert.equal(saved.length,3,'Must persist manually added third slide');
            await editor.locator('[data-ed="reset"]').click();
          }catch(e){
            console.log('TEST FAILED',String(e),'ERRORS',JSON.stringify(errors),'SNAPSHOT',JSON.stringify(saved)?.slice(0,300));
            console.log('PAGE', (await page.locator('body').innerText()).slice(-2600));
            throw e;
          }finally{await browser.close()}
          console.log('BROWSER TEST PASSED: editing and saving Presenta, reopening preview, adding page');
          JS
