name: Verify Oleh photo image service
on:
  push:
    branches: [SIR-Match-Story]
    paths:
      - .github/workflows/verify-oleh-photo.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official SIR player page HTML for actual photos
        run: |
          python3 - <<'PY'
          import re,requests
          for page in ['https://www.sirsafetyperugia.it/player/oleh-plotnytskyi','https://www.sirsafetyperugia.it/players/']:
              try:
                  r=requests.get(page,timeout=20)
                  print('\nPAGE',page,'STATUS',r.status_code,'CONTENT_LENGTH',len(r.content))
                  for m in re.finditer(r'<img\\b[^>]*>',r.text,flags=re.I):
                      info=m.group(0)
                      if 'plot' in info.lower() or 'oleh' in info.lower() or '17' in info.lower() or '/players/' in info.lower():
                          print('IMG',info[:330])
                  files=list(dict.fromkeys(re.findall(r'/assets/img/players/[a-zA-Z0-9_@.,%+-]+',r.text,flags=re.I)))
                  print('PLAYER IMAGE PATHS',len(files))
                  print('\n'.join(files[:75]))
              except Exception as e: print('ERROR',type(e).__name__,str(e)[:200])
          PY
