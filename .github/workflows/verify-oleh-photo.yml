name: Verify Oleh photo image service
on:
  push:
    branches: [SIR-Match-Story]
    paths:
      - .github/workflows/verify-oleh-photo.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official 17 photo and image proxy
        run: |
          for link in            "https://www.sirsafetyperugia.it/assets/img/players/17_app%400%2C5x.png"            "https://www.sirsafetyperugia.it/assets/img/players/plotnytskyi_no_sfondo.png"            "https://rwfxsbxxykocdcqphfvb.supabase.co/functions/v1/match-story-api?action=perugia-photo&player=oleh-plotnytskyi"
          do
            echo "Checking: $link"
            curl -L -sS --max-time 28 -o /tmp/oleh-check -w "RESULT: %{http_code} %{content_type} %{size_download} bytes\n" "$link" || true
            file /tmp/oleh-check || true
            if [ "$(stat -c%s /tmp/oleh-check)" -lt 1000 ]; then head -c 500 /tmp/oleh-check; echo; fi
          done
