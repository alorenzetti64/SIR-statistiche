async function load(){const {data:{user},error}=await sb.auth.getUser();me=user;if(!me){member=null;return choose()}let m=await query('hb_members','select',null,['user_id',me.id]);member=m[0];if(!member)return choose();acct.innerHTML='<div class="row"><span class="muted">'+esc(member.name)+' · '+esc(role())+'</span>'+b('Cambia ambiente','logout','outline')+'</div>';return home()}
async function enter(which){try{notice('Apertura ambiente...');let user=me;if(!user){const {data,error}=await sb.auth.signInAnonymously();if(error)throw new Error('Accesso anonimo non disponibile nel database: '+error.message);user=data.user;me=user;}const names={loreti:'#10 Loreti',gaggini:'#20 Gaggini',staff:'Staff'};const selectedRole=which==='staff'?'staff':'libero';if(member){if(member.name===names[which])return home();await sb.auth.signOut();me=null;member=null;return enter(which)}const data=await query('hb_members','insert',{user_id:user.id,name:names[which],role:selectedRole});member=data[0];return load()}catch(e){errMsg(e)}}
async function home(){try{matches=await query('hb_matches');matches.sort((a,b)=>b.created_at.localeCompare(a.created_at));shell('<div class="row between"><div><h2>I match</h2><p class="muted">Apri un incontro per vedere gli attaccanti e i montaggi.</p></div>'+(role()==='staff'?b('+ Nuovo match','newMatch'):'')+'</div><div class="grid">'+matches.map(m=>'<div class="box"><h3>'+esc(m.title)+'</h3><p class="muted">High Ball avversari</p>'+b('Apri match','match:'+m.id)+'</div>').join('')+'</div>'+(!matches.length?'<div class="box">Nessun match ancora assegnato.</div>':''))}catch(e){errMsg(e)}}
function newMatch(){shell('<div class="row">'+b('← Indietro','home','outline')+'</div><div class="box"><h2>Nuovo match</h2><form id="fm"><label>Nome incontro</label><input id="mtitle" placeholder="Es. Cuneo - Perugia" required><button>Crea</button></form></div>');document.querySelector('#fm').onsubmit=async e=>{e.preventDefault();try{const a=await query('hb_matches','insert',{title:document.querySelector('#mtitle').value.trim(),created_by:me.id});return openMatch(a[0].id)}catch(x){errMsg(x)}}}
async function openMatch(id){try{selectedMatch=(await query('hb_matches','select',null,['id',id]))[0];attackers=await query('hb_attackers','select',null,['match_id',id]);attackers.sort((a,b)=>a.ordering-b.ordering||a.name.localeCompare(b.name));const members=await query('hb_members');let admin=role()==='staff';shell('<div class="row between"><div>'+b('← Tutti i match','home','outline')+'<h2>'+esc(selectedMatch.title)+'</h2></div>'+(admin?b('+ Attaccante','newAttacker'):'')+'</div>'+(admin?'<div class="box"><h3>Assegna i due Liberi</h3><div class="two"><div><label>#10 Loreti</label><select id="libA"><option value="">Seleziona</option>'+members.filter(x=>x.role==='libero').map(x=>'<option value="'+x.user_id+'" '+(x.user_id===selectedMatch.libero_a?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div><label>#20 Gaggini</label><select id="libB"><option value="">Seleziona</option>'+members.filter(x=>x.role==='libero').map(x=>'<option value="'+x.user_id+'" '+(x.user_id===selectedMatch.libero_b?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div>'+b('Salva assegnazioni','assign')+'</div>':'')+'<h3>Attaccanti</h3><div class="list">'+attackers.map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><div class="muted">Scheda High Ball</div></div>'+b('Apri scheda','attacker:'+a.id)+'</div>').join('')+'</div>'+(!attackers.length?'<p class="muted">Nessun attaccante inserito.</p>':''))}catch(x){errMsg(x)}}
function newAttacker(){shell('<div>'+b('← Match','backMatch','outline')+'</div><div class="box"><h2>Aggiungi attaccante</h2><form id="fa"><label>Nome attaccante</label><input id="aname" required><label>Link montaggio video</label><input id="alink" type="url" placeholder="https://..." required><button>Salva</button></form></div>');document.querySelector('#fa').onsubmit=async e=>{e.preventDefault();try{await query('hb_attackers','insert',{match_id:selectedMatch.id,name:document.querySelector('#aname').value.trim(),video_url:document.querySelector('#alink').value.trim()});await openMatch(selectedMatch.id)}catch(x){errMsg(x)}}}
async function openAttacker(id){try{selectedAttacker=(await query('hb_attackers','select',null,['id',id]))[0];const analysis=await query('hb_analyses','select',null,['attacker_id',id]);const mine=analysis.find(a=>a.user_id===me.id);const assigned=me.id===selectedMatch.libero_a||me.id===selectedMatch.libero_b;const both=analysis.filter(a=>a.completed).length===2&&!!selectedMatch.libero_a&&!!selectedMatch.libero_b;const shared=(await query('hb_shared','select',null,['attacker_id',id]))[0];const admins=role()==='staff';shell('<div class="row between">'+b('← Attaccanti','backMatch','outline')+'<span class="pill">'+esc(selectedMatch.title)+'</span></div><h2>'+esc(selectedAttacker.name)+'</h2><div class="box"><div class="row between"><div><strong>Montaggio video</strong><div class="muted">Si apre in una nuova scheda</div></div><a class="button" target="_blank" rel="noopener noreferrer" href="'+esc(selectedAttacker.video_url)+'">Guarda video ↗</a></div></div>'+(assigned?'<div class="box"><div class="row between"><h3>La mia analisi libera</h3><span class="pill '+(mine?.completed?'success':'')+'">'+(mine?.completed?'Conclusa':'Bozza')+'</span></div>'+(mine?.completed?'<p style="white-space:pre-wrap">'+esc(mine.content)+'</p><p class="muted">L’analisi conclusa non si modifica: rimane come osservazione originale.</p>':'<label>Scrivi ciò che osservi, senza campi o categorie prestabiliti</label><textarea id="mytext" placeholder="La mia lettura dell’attaccante...">'+esc(mine?.content||'')+'</textarea><div class="row">'+b('Salva bozza','saveMine','secondary')+b('Concludi analisi','finishMine')+'</div>')+'</div>':'')+(both||admins?'<div class="box"><h3>Le due letture individuali</h3><div class="two">'+[selectedMatch.libero_a,selectedMatch.libero_b].map((uid,i)=>'<div><div class="muted">LIBERO '+(i+1)+'</div><p style="white-space:pre-wrap">'+esc(analysis.find(x=>x.user_id===uid)?.content||'Non ancora disponibile')+'</p></div>').join('')+'</div></div>':assigned?'<div class="box"><p class="muted">Il confronto sarà disponibile quando entrambi i Liberi avranno concluso la propria analisi.</p></div>':'')+(both||admins?'<div class="box"><div class="row between"><h3>Lettura condivisa</h3><span class="pill">'+esc(shared?.status||'draft')+'</span></div><textarea id="sharedtext" '+(!admins&&shared&&!['draft','changes_requested'].includes(shared.status)?'disabled':'')+' placeholder="Costruite una lettura comune...">'+esc(shared?.content||'')+'</textarea>'+(shared?.staff_note?'<p><strong>Nota staff:</strong> '+esc(shared.staff_note)+'</p>':'')+'<div class="row">'+b('Salva lettura','saveShared','secondary')+(!admins?b('Invia allo staff','submitShared'):b('Approva e pubblica','approveShared'))+(admins?b('Richiedi modifica','requestChanges','outline'):'')+'</div>'+(admins?'<label>Nota o richiesta dello staff</label><input id="staffnote" value="'+esc(shared?.staff_note||'')+'">':'')+'</div>':'')+'</div>')}catch(x){errMsg(x)}}
async function mineSave(completed){try{const content=document.querySelector('#mytext').value.trim();if(completed&&!content)return notice('Scrivi l’analisi prima di concluderla.',true);const found=(await query('hb_analyses','select',null,['attacker_id',selectedAttacker.id])).find(a=>a.user_id===me.id);if(found){await sb.from('hb_analyses').update({content,completed,updated_at:new Date().toISOString()}).eq('attacker_id',selectedAttacker.id).eq('user_id',me.id).throwOnError()}else await query('hb_analyses','insert',{attacker_id:selectedAttacker.id,user_id:me.id,content,completed});await openAttacker(selectedAttacker.id);notice(completed?'Analisi conclusa.':'Bozza salvata.')}catch(e){errMsg(e)}}
async function sharedSave(status){try{const content=document.querySelector('#sharedtext').value.trim();if(['submitted','approved'].includes(status)&&!content)return notice('Scrivi la lettura condivisa prima di inviarla.',true);const existing=(await query('hb_shared','select',null,['attacker_id',selectedAttacker.id]))[0];const payload={content,status,updated_at:new Date().toISOString()};if(role()==='staff')payload.staff_note=document.querySelector('#staffnote')?.value||'';if(existing){await query('hb_shared','update',payload,['attacker_id',selectedAttacker.id])}else await query('hb_shared','insert',{attacker_id:selectedAttacker.id,...payload});await openAttacker(selectedAttacker.id);notice('Scheda aggiornata.')}catch(e){errMsg(e)}}
document.body.addEventListener('click',async e=>{const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;try{if(act==='logout'){await sb.auth.signOut();me=null;member=null;return choose()}if(act.startsWith('enter:'))return enter(act.slice(6));if(act==='home')return home();if(act==='newMatch')return newMatch();if(act==='newAttacker')return newAttacker();if(act==='backMatch')return openMatch(selectedMatch.id);if(act==='saveMine')return mineSave(false);if(act==='finishMine')return confirm('Concludere l’analisi? Non potrai modificarne il testo individuale.')&&mineSave(true);if(act==='saveShared')return sharedSave('draft');if(act==='submitShared')return confirm('Inviare allo staff?')&&sharedSave('submitted');if(act==='approveShared')return sharedSave('approved');if(act==='requestChanges')return sharedSave('changes_requested');if(act==='assign'){const a=document.querySelector('#libA').value||null,b=document.querySelector('#libB').value||null;if(a&&a===b)throw Error('Seleziona due Liberi diversi.');await query('hb_matches','update',{libero_a:a,libero_b:b},['id',selectedMatch.id]);return openMatch(selectedMatch.id)}if(act.startsWith('match:'))return openMatch(act.slice(6));if(act.startsWith('attacker:'))return openAttacker(act.slice(9))}catch(x){errMsg(x)}});
sb.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>
